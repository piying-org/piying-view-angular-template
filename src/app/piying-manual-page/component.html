<div class="grid gap-2">
  <input type="text" class="input" [formControl]="field" [path]="['text1']" />
  <input
    type="number"
    class="input"
    [formControl]="field"
    [path]="['number1']"
  />
  <ng-container [fieldTemplate]="field" [path]="['radio1']"></ng-container>
  
  <input
    type="checkbox"
    class="checkbox"
    [formControl]="field"
    [path]="['checkbox1']"
  />
</div>
